[project]
name = "congtyx-bpmn"
version = "0.1.0"
description = "Reproducible BPMN bottleneck analysis, monthly forecasting and scenario evaluation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "networkx>=3.3,<4",
  "matplotlib>=3.9,<4",
  "pm4py>=2.7,<3",
  "gensim>=4.4,<5",
  "joblib>=1.4,<2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
congtyx = "bpmn_project.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bpmn_project"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.uv.sources]
gensim = { git = "https://github.com/piskvorky/gensim.git", rev = "ecf22c266f3b8930610114c149d8991ed14e2a16" }

